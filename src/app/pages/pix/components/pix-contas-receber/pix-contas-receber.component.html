<div class="card flex flex-col gap-6">
    <div class="flex flex-col gap-2">
        <div class="font-semibold text-xl">{{ operationConfig.nome }}</div>
        <p class="m-0 text-surface-500">Informe o número do lançamento para consultar o título e gerar a chave PIX para pagamento.</p>
    </div>

    <p-fluid>
        <div class="flex flex-col gap-4">
            <div class="flex flex-col gap-2">
                <label for="numeroLancamento" class="font-medium">Número do lançamento</label>
                <input
                    pInputText
                    id="numeroLancamento"
                    type="text"
                    [(ngModel)]="numeroLancamento"
                    [disabled]="loading()"
                    placeholder="Ex.: 123456"
                />
            </div>

            <p-button
                label="Gerar PIX"
                icon="pi pi-qrcode"
                [loading]="loading()"
                [disabled]="!numeroLancamento.trim()"
                (onClick)="generatePix()"
            />
        </div>
    </p-fluid>

    @if (errorMessage()) {
        <div class="rounded-border border border-red-200 bg-red-50 px-4 py-3 text-red-700 dark:border-red-800 dark:bg-red-950/40 dark:text-red-200">
            {{ errorMessage() }}
        </div>
    }
</div>
