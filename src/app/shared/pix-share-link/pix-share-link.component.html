@if (buildUrl()) {
    <div class="flex items-center gap-2">
        <p-button
            [label]="showLabels ? (copied() ? 'Copiado!' : copyLabel) : ''"
            [icon]="copied() ? 'pi pi-check' : 'pi pi-copy'"
            [size]="size"
            severity="secondary"
            [outlined]="true"
            [pTooltip]="!showLabels ? (copied() ? 'Copiado!' : copyLabel) : ''"
            tooltipPosition="top"
            (onClick)="copy()"
        />
        <p-button
            [label]="showLabels ? openLabel : ''"
            icon="pi pi-external-link"
            [size]="size"
            severity="secondary"
            [outlined]="true"
            [pTooltip]="!showLabels ? openLabel : ''"
            tooltipPosition="top"
            (onClick)="open()"
        />
    </div>
}
